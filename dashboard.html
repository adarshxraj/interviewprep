<!DOCTYPE html>
<!-- InterviewPrep: Dashboard page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard" data-auth="user" data-simple="">
  <div id="nav"></div>
  <main>
    <section class="container py-4">
      <h1 class="h3" id="welcome">Welcome back!</h1><p>Keep practicing and improve your interview preparation.</p>
      <div class="row row-cols-1 row-cols-md-3 g-3 text-center mb-4">
        <div class="col"><div class="card card-soft p-3"><div>Coding completed</div><span class="stat-num" id="s1">0</span></div></div>
        <div class="col"><div class="card card-soft p-3"><div>Accuracy</div><span class="stat-num" id="s2">0%</span></div></div>
        <div class="col"><div class="card card-soft p-3"><div>Streak</div><span class="stat-num" id="s3">0 days</span></div></div>
      </div>
      <h2 class="h4">Continue preparation</h2>
      <div class="card card-soft p-3 mb-3"><b>Reasoning practice</b><div class="progress my-2"><div class="progress-bar" id="p1" style="width:0%">0%</div></div><a href="reasoning.html" class="btn btn-main btn-sm align-self-start">Continue <i class="bi bi-arrow-right"></i></a></div>
      <div class="card card-soft p-3"><b>Coding practice</b><div class="progress my-2"><div class="progress-bar" id="p2" style="width:0%">0%</div></div><a href="coding.html" class="btn btn-main btn-sm align-self-start">Continue <i class="bi bi-arrow-right"></i></a></div>
    </section>
  </main>
  <footer id="foot" class="bg-dark-green text-center text-white py-3 mt-5"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
