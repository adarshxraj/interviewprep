<!DOCTYPE html>
<!-- InterviewPrep: Contact page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="contact" data-auth="" data-simple="">
  <div id="nav"></div>
  <main>
  <section class="page-banner"><div class="container"><h1 class="h2">Contact us</h1><p>Have a question or feedback? Send us a message</p></div></section>
    <section class="container py-5"><div class="card mx-auto p-4" style="max-width:600px"><div id="msg"></div>
      <form id="f">
        <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" required></div>
        <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" required></div>
        <div class="mb-3"><label class="form-label" for="text">Message</label><textarea class="form-control" id="text" rows="4" required></textarea></div>
        <button class="btn btn-main w-100">Send message</button>
      </form></div></section>
  </main>
  <footer id="foot" class="bg-dark-green text-center text-white py-3 mt-5"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
