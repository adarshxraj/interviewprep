<!DOCTYPE html>
<!-- InterviewPrep: Reasoning page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reasoning | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="reasoning" data-auth="user" data-simple="">
  <div id="nav"></div>
  <main>
  <section class="page-banner"><div class="container"><h1 class="h2">Reasoning questions</h1><p>Practice aptitude and logical thinking</p></div></section>
    <section class="container py-5">
      <form class="row g-2 mb-4" id="filters">
        <div class="col-md-6"><input class="form-control" type="search" id="search" placeholder="Search question"></div>
        <div class="col-6 col-md-2"><select class="form-select" id="cat"><option value="All">Category: All</option><option>Aptitude</option><option>Logical</option></select></div>
        <div class="col-6 col-md-2"><select class="form-select" id="diff"><option value="All">Difficulty: All</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
        <div class="col-md-2"><button class="btn btn-main w-100">Search</button></div>
      </form>
      <p class="text-center fw-semibold" id="score">Score this session: 0/0</p>
      <div class="card p-4 mx-auto" style="max-width:700px" id="card"></div>
    </section>
  </main>
  <footer id="foot" class="bg-dark-green text-center text-white py-3 mt-5"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
