<!DOCTYPE html>
<!-- InterviewPrep: Manage questions page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage questions | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="admin-questions" data-auth="admin" data-simple="">
  <header id="nav" class="bg-dark-green py-3"></header>
  <div class="container-fluid"><div class="row">
    <aside id="side" class="col-md-3 col-lg-2 p-3"></aside>
    <main class="col-md-9 col-lg-10 p-3 p-md-4">
      <h1 class="h3">Questions</h1><p>Add, edit or delete practice questions</p><div id="msg"></div>
      <div class="card p-3 mb-4"><h2 class="h5" id="formTitle">Add question</h2>
        <form id="f" class="row g-2">
          <div class="col-md-3"><select class="form-select" id="qtype"><option value="reasoning">Reasoning</option><option value="coding">Coding</option></select></div>
          <div class="col-md-3"><select class="form-select" id="qdiff"><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
          <div class="col-md-6" id="cBox" hidden><input class="form-control" id="qco" placeholder="Company name (e.g. Google)"></div>
          <div class="col-md-6" id="rBox"><select class="form-select" id="qcat"><option>Aptitude</option><option>Logical</option></select></div>
          <div class="col-12"><input class="form-control" id="qtext" placeholder="Question text" required></div>
          <div class="col-12 row g-2 m-0 p-0" id="rBox2"><div class="col-md-6"><input class="form-control" id="o0" placeholder="Option A"></div><div class="col-md-6"><input class="form-control" id="o1" placeholder="Option B"></div><div class="col-md-6"><input class="form-control" id="o2" placeholder="Option C"></div><div class="col-md-6"><input class="form-control" id="o3" placeholder="Option D"></div><div class="col-md-6"><select class="form-select" id="qans"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select></div></div>
          <div class="col-12"><input class="form-control" id="qexp" placeholder="Explanation / hint" required></div>
          <div class="col-12"><button class="btn btn-main">Save question</button> <button type="button" class="btn btn-outline-secondary" id="cancel">Clear</button></div>
        </form></div>
      <select class="form-select mb-3" id="qfilter" style="max-width:200px"><option value="all">Show all</option><option value="reasoning">Reasoning</option><option value="coding">Coding</option></select>
      <div class="table-responsive card"><table class="table align-middle mb-0"><thead><tr><th>#</th><th>Type</th><th>Question</th><th>Category / Company</th><th>Level</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
    </main>
  </div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
