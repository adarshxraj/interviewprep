<!DOCTYPE html>
<!-- InterviewPrep: Manage users page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage users | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="admin-users" data-auth="admin" data-simple="">
  <header id="nav" class="bg-dark-green py-3"></header>
  <div class="container-fluid"><div class="row">
    <aside id="side" class="col-md-3 col-lg-2 p-3"></aside>
    <main class="col-md-9 col-lg-10 p-3 p-md-4">
      <h1 class="h3">Users</h1><p>Manage registered users</p>
      <input class="form-control mb-3" type="search" id="search" placeholder="Search users..." style="max-width:360px">
      <div class="table-responsive card"><table class="table align-middle mb-0"><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="modal fade" id="modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">User details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="mBody"></div></div></div></div>
    </main>
  </div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
