<!DOCTYPE html>
<!-- InterviewPrep: Forgot password page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="forgot" data-auth="" data-simple="1">
  <div id="nav"></div>
  <main>
    <div class="container py-5"><div class="card mx-auto p-4" style="max-width:420px">
      <h1 class="h3 text-center">Reset password</h1><p class="text-center">Enter your email and a new password.</p>
      <div id="msg"></div>
      <form id="f">
        <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email"  required></div><div class="mb-3"><label class="form-label" for="pw">New password</label><input class="form-control" type="password" id="pw" minlength="6" required></div>
        <button class="btn btn-main w-100">Change password</button>
      </form>
      <hr><p class="text-center mb-0"><a href="login.html">Back to login</a></p>
    </div></div>
  </main>
  <footer id="foot" class="bg-dark-green text-center text-white py-3 mt-5"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
