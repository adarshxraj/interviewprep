<!DOCTYPE html>
<!-- InterviewPrep: Admin dashboard page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="admin-dashboard" data-auth="admin" data-simple="">
  <header id="nav" class="bg-dark-green py-3"></header>
  <div class="container-fluid"><div class="row">
    <aside id="side" class="col-md-3 col-lg-2 p-3"></aside>
    <main class="col-md-9 col-lg-10 p-3 p-md-4">
      <h1 class="h3 mb-3">Dashboard</h1>
      <div class="row row-cols-1 row-cols-md-3 g-3 text-center mb-4">
        <div class="col"><div class="card card-soft p-3"><div>Students</div><span class="stat-num" id="c1">0</span></div></div>
        <div class="col"><div class="card card-soft p-3"><div>Questions</div><span class="stat-num" id="c2">0</span></div></div>
        <div class="col"><div class="card card-soft p-3"><div>Unread messages</div><span class="stat-num" id="c3">0</span></div></div>
      </div>
      <div class="card mb-4"><div class="card-header bg-white fw-semibold">Recent activity</div><ul class="list-group list-group-flush" id="activity"></ul></div>
      <h2 class="h5">Quick actions</h2>
      <a href="admin-questions.html" class="btn btn-main">+ Add question</a> <a href="admin-users.html" class="btn btn-accent">View users</a> <a href="admin-messages.html" class="btn btn-accent">View messages</a>
    </main>
  </div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
