<!DOCTYPE html>
<!-- InterviewPrep: Login page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login" data-auth="" data-simple="1">
  <div id="nav"></div>
  <main>
    <div class="container py-5"><div class="card mx-auto p-4" style="max-width:420px">
      <h1 class="h3 text-center">Login</h1><p class="text-center text-secondary small"></p>
      <div id="msg"></div>
      <form id="f">
        <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" placeholder="enter your email" required></div><div class="mb-3"><label class="form-label" for="pw">Password</label><input class="form-control" type="password" id="pw" placeholder="enter your password" required></div>
        <button class="btn btn-main w-100">Login</button>
      </form>
      <hr><p class="text-center mb-1"><a href="forgot-password.html">Forgot password?</a></p><p class="text-center mb-0">Don't have an account? <a href="signup.html">Register</a></p>
    </div></div>
  </main>
  <footer id="foot" class="bg-dark-green text-center text-white py-3 mt-5"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
