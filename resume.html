<!DOCTYPE html>
<!-- InterviewPrep: Resume page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume | InterviewPrep</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="resume" data-auth="user" data-simple="">
  <div id="nav"></div>
  <main>
  <section class="page-banner"><div class="container"><h1 class="h2">Resume formats</h1><p>Fill your details, pick a format and print or save as PDF</p></div></section>
    <section class="container py-5"><div class="row g-4">
      <div class="col-lg-5"><div class="card p-3">
        <p class="mb-1 fw-semibold">Choose a format</p><div class="mb-3"><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="fmt" id="f1" value="1" checked><label class="form-check-label" for="f1">Simple</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="fmt" id="f2" value="2" ><label class="form-check-label" for="f2">Classic</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="fmt" id="f3" value="3" ><label class="form-check-label" for="f3">Modern</label></div></div>
        <div class="mb-2"><label class="form-label" for="r_name">Full name</label><input class="form-control" id="r_name"></div><div class="mb-2"><label class="form-label" for="r_email">Email</label><input class="form-control" id="r_email"></div><div class="mb-2"><label class="form-label" for="r_phone">Phone</label><input class="form-control" id="r_phone"></div><div class="mb-2"><label class="form-label" for="r_objective">Career objective</label><textarea class="form-control" id="r_objective" rows="2"></textarea></div>
        <div class="mb-2"><label class="form-label" for="r_education">Education (one per line)</label><textarea class="form-control" id="r_education" rows="2"></textarea></div><div class="mb-2"><label class="form-label" for="r_skills">Skills (comma separated)</label><input class="form-control" id="r_skills"></div><div class="mb-2"><label class="form-label" for="r_projects">Projects (one per line)</label><textarea class="form-control" id="r_projects" rows="3"></textarea></div>
        <button class="btn btn-accent" id="print"><i class="bi bi-printer"></i> Print / Save as PDF</button>
      </div></div>
      <div class="col-lg-7"><div id="preview"></div></div>
    </div></section>
  </main>
  <footer id="foot" class="bg-dark-green text-center text-white py-3 mt-5"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
